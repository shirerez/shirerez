---

- name: Create a Windows VM
  hosts: localhost
  become: false
  gather_facts: false 
  tasks:
    - name: create folder
      community.vmware.vcenter_folder:
        hostname: vcenter_hostname
        username: vcenter_username
        password: abcd1234
        validate_certs: false
        datacenter_name: vmwaredatacenter
        folder_name: my_windows_vm
        folder_type: vm
        state: present
    - name: create VM
      community.vmware.vmware_guest:
        hostname: vcenter_hostname
        username: vcenter_username
        password: abcd1234
        validate_certs: false
        datacenter: vmwaredatacenter
        name: my_windows_vm
        folder: my_windows_vm
        state: poweredon
        guest_id: windows9_64Guest
        cluster: XXX
        disk:
          - size_gb: 2
            type: thin
            datastore: Datastore-1
        hardware:
          memory_mb: 1024
          num_cpus: 1
          scsi: paravirtual
        networks:
          - name: my_network_card
            device_type: vmxnet3

    - name: Add VM dynamically
      add_host:
        name: newvm
        ansible_host: 1.2.3.4 #ה-IP של המכונה שיצרנו
        ansible_user: Administrator #משתמש להתחברות לVM
        ansible_password: 12345 #סיסמה להתחברות לVM
        ansible_connection: winrm
        groups: new_windows_VM
    
- name: Join VM to domain
  hosts: new_windows_VM
  gather_facts: false
  tasks:

    - name: Join VM to domain
      ansible.windows.win_domain_membership:
        dns_domain_name: domainname.local
        domain_admin_user: DOMAINNAME\admin
        domain_admin_password: 12345
        state: domain
        